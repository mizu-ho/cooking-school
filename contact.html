
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>CONTACT | 料理教室 みず穂  ｜学芸大学</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1><a href="index.html">料理教室 みず穂  ｜学芸大学</a></h1>

  <nav>
    <a href="index.html">HOME</a>
    <a href="recipe.html">RECIPE</a>
    <a href="profile.html">PROFILE</a>
    <a href="class.html">COOKING CLASS</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>


<main>

  <section class="contact">

    <h2 class="page-title">CONTACT</h2>

    <p class="contact-intro">
      お問い合わせ・レッスンのお申し込み
    </p>

    <p class="contact-message">
      料理教室についてのお問い合わせや、<br>
      レッスンのお申し込みはこちらからお願いいたします。
    </p>
<form
  class="contact-form"
  action="https://formspree.io/f/xyeyllzw"
  method="POST"
>


  <!-- 受信メールの件名 -->
  <input
    type="hidden"
    name="subject"
    value="【料理教室 みず穂】お問い合わせ・レッスンのお申し込み"
  >


  <div class="form-item">

    <label for="purpose">
      お問い合わせ内容 <span>※</span>
    </label>

    <select id="purpose" name="お問い合わせ内容" required>
      <option value="">選択してください</option>
      <option value="料理教室へのお申し込み">料理教室へのお申し込み</option>
      <option value="体験レッスンについて">体験レッスンについて</option>
      <option value="オンラインレッスンについて">オンラインレッスンについて</option>
      <option value="対面レッスンについて">対面レッスンについて</option>
      <option value="その他のお問い合わせ">その他のお問い合わせ</option>
    </select>

  </div>


  <div class="form-item">

    <label for="name">
      お名前 <span>※</span>
    </label>

    <input
      type="text"
      id="name"
      name="お名前"
      placeholder="お名前"
      required
    >

  </div>


  <div class="form-item">

    <label for="email">
      メールアドレス <span>※</span>
    </label>

    <input
      type="email"
      id="email"
      name="email"
      placeholder="メールアドレス"
      required
    >

  </div>


  <div class="form-item">

    <label for="style">
      ご希望の受講方法
    </label>

    <select id="style" name="ご希望の受講方法">
      <option value="">選択してください</option>
      <option value="オンライン">オンライン</option>
      <option value="対面">対面</option>
      <option value="相談して決めたい">相談して決めたい</option>
    </select>

  </div>


  <div class="form-item">

    <label for="lesson">
      ご希望のレッスン
    </label>

    <select id="lesson" name="ご希望のレッスン">
      <option value="">選択してください</option>
      <option value="500円体験レッスン">500円体験レッスン</option>
      <option value="基本Aレッスン（和食）">基本Aレッスン（和食）</option>
      <option value="基本Bレッスン（洋食）">基本Bレッスン（洋食）</option>
      <option value="本格レッスン">本格レッスン</option>
      <option value="相談して決めたい">相談して決めたい</option>
    </select>

  </div>


  <div class="form-item">

    <label for="date">
      ご希望日時
    </label>

    <input
      type="text"
      id="date"
      name="ご希望日時"
      placeholder="例：10月12日 13:00頃"
    >

  </div>


  <div class="form-item">

    <label for="message">
      メッセージ
    </label>

    <textarea
      id="message"
      name="message"
      rows="7"
      placeholder="ご質問やご希望などをご入力ください"
    ></textarea>

  </div>


  <div class="form-submit">
    <button type="submit">送信する</button>
  </div>

</form>
</section>

</main>


<footer>
  <p>© 料理教室 みず穂  ｜学芸大学</p>
</footer>

</body>

</html>
```
